<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24513b"/>
      <stop offset="100%" stop-color="#143324"/>
    </linearGradient>
    <linearGradient id="stemLine3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#52b788" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b7e4c7"/>
    </linearGradient>
    <filter id="softGlow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#081c15" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景 (フォレストグリーン) -->
  <rect width="512" height="512" rx="116" fill="url(#bg3)"/>

  <!-- タイムライン縦軸（一本の幹） -->
  <line x1="256" y1="85" x2="256" y2="425" stroke="url(#stemLine3)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- 過去ノード（ふたりの出会い） -->
  <circle cx="256" cy="385" r="6" fill="#52b788" opacity="0.7"/>

  <!-- 現在ノード（TODAY）＆若葉の芽吹き -->
  <g filter="url(#softGlow3)">
    <circle cx="256" cy="256" r="16" fill="#ffffff" opacity="0.2"/>
    <circle cx="256" cy="256" r="8" fill="#ffffff"/>

    <!-- 左の若葉 -->
    <path d="M 256,256 C 220,256 175,225 185,175 C 215,170 245,210 256,240 Z" fill="#74c69d"/>
    <!-- 右の若葉 -->
    <path d="M 256,240 C 275,200 325,165 345,185 C 340,225 290,256 256,256 Z" fill="#b7e4c7"/>
  </g>

  <!-- 未来ノード（希望の星） -->
  <circle cx="256" cy="115" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="256" cy="115" r="14" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
</svg>
