<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景メッシュグラデーション -->
    <radialGradient id="meshGrad1" cx="20%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="40%" stop-color="#ff4b6b" />
      <stop offset="80%" stop-color="#d91b5c" />
      <stop offset="100%" stop-color="#880e4f" />
    </radialGradient>
    
    <radialGradient id="glowTop" cx="80%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#ffc3a0" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#ff758c" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffe4e6" />
      <stop offset="70%" stop-color="#fecdd3" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>

    <linearGradient id="ribbonPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="50%" stop-color="#f5d0fe" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- 影効果 -->
    <filter id="smoothShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4a041f" flood-opacity="0.35" />
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ffffff" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 背景アプリアイコン角丸ベース (Squircle: iOSスタイル角丸) -->
  <rect width="512" height="512" rx="116" fill="url(#meshGrad1)" />
  <rect width="512" height="512" rx="116" fill="url(#glowTop)" />

  <!-- 繊細な装飾ライン（時を刻む縦のクロニクル光彩） -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="8 8" stroke-linecap="round" opacity="0.3" />

  <!-- 背景の微細な光のリング（出会いと未来の約束を繋ぐ環） -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 14" />

  <!-- 中央のモダン・インフィニティ＆ハート（ふたりのタイムラインの交差） -->
  <g filter="url(#smoothShadow)">
    <!-- パス1: 左下から右上に紡がれる光のリボン（過去から未来へ） -->
    <path d="M 140,320 C 90,260 100,170 180,140 C 230,120 256,170 256,200 C 256,170 282,120 332,140 C 412,170 422,260 372,320 C 310,390 256,420 256,420 C 256,420 202,390 140,320 Z"
          fill="none"
          stroke="url(#ribbonGold)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- パス2: 繊細な内部ハートのハイライト -->
    <path d="M 180,170 C 150,170 135,195 145,230 C 160,280 256,360 256,360 C 256,360 352,280 367,230 C 377,195 362,170 332,170 C 290,170 266,215 256,225 C 246,215 222,170 180,170 Z"
          fill="#ffffff"
          opacity="0.9" />
  </g>

  <!-- 時の記憶の星ノード（4つのきらめき） -->
  <!-- 頂点の未来の星 -->
  <g transform="translate(256, 88)" filter="url(#innerGlow)">
    <circle cx="0" cy="0" r="10" fill="#ffffff" />
    <polygon points="0,-18 4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- 中心の輝くノード（TODAY） -->
  <g transform="translate(256, 260)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" opacity="0.3" />
    <circle cx="0" cy="0" r="11" fill="#ffffff" />
    <circle cx="0" cy="0" r="5" fill="#e11d48" />
  </g>

  <!-- 始点の過去の記憶ノード -->
  <g transform="translate(256, 432)">
    <circle cx="0" cy="0" r="8" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
