<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景オーガニックグリーン グラデーション -->
    <radialGradient id="natureMesh" cx="30%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#52b788" />
      <stop offset="35%" stop-color="#2d6a4f" />
      <stop offset="75%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#081c15" />
    </radialGradient>
    
    <radialGradient id="sunGlow" cx="75%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#d8f3dc" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#74c69d" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#2d6a4f" stop-opacity="0" />
    </radialGradient>

    <!-- 葉とラインのグラデーション -->
    <linearGradient id="leafGradLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#74c69d" />
      <stop offset="60%" stop-color="#d8f3dc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="leafGradRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#52b788" />
      <stop offset="60%" stop-color="#b7e4c7" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#74c69d" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#081c15" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- アプリアイコン角丸ベース (iOS風Squircle) -->
  <rect width="512" height="512" rx="116" fill="url(#natureMesh)" />
  <rect width="512" height="512" rx="116" fill="url(#sunGlow)" />

  <!-- 背景の繊細な光輪（時の環） -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 12" />

  <!-- タイムライン縦軸（ふたりの歩む1本の幹） -->
  <line x1="256" y1="70" x2="256" y2="442" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round" opacity="0.75" />

  <!-- ボタニカルシンボル: 共に育つ対の若葉（ふたりの象徴） -->
  <g filter="url(#softShadow)">
    <!-- 左の若葉（寄り添う軌跡） -->
    <path d="M 256,290 C 220,290 150,260 160,190 C 170,130 230,170 256,220 Z"
          fill="url(#leafGradLeft)"
          opacity="0.95" />

    <!-- 右の若葉（共に歩む未来） -->
    <path d="M 256,250 C 290,250 360,220 350,150 C 340,90 280,130 256,180 Z"
          fill="url(#leafGradRight)"
          opacity="0.95" />

    <!-- 葉脈の繊細なライン -->
    <path d="M 256,220 Q 200,180 180,165" stroke="#2d6a4f" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M 256,180 Q 310,140 330,125" stroke="#1b4332" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4" />
  </g>

  <!-- 未来の星（頂点ノード） -->
  <g transform="translate(256, 75)">
    <circle cx="0" cy="0" r="12" fill="#ffffff" />
    <polygon points="0,-20 5,-5 20,0 5,5 0,20 -5,5 -20,0 -5,-5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- 現在のノード（TODAY・生きた結節点） -->
  <g transform="translate(256, 260)">
    <circle cx="0" cy="0" r="22" fill="#d8f3dc" opacity="0.3" />
    <circle cx="0" cy="0" r="13" fill="#ffffff" />
    <circle cx="0" cy="0" r="6" fill="#2d6a4f" />
  </g>

  <!-- 過去の起点ノード -->
  <g transform="translate(256, 425)">
    <circle cx="0" cy="0" r="8" fill="#b7e4c7" opacity="0.8" />
  </g>
</svg>
