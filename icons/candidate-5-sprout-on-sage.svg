<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40916c"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <filter id="softShadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#143e2d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 背景 (上質なセージグリーン) -->
  <rect width="512" height="512" rx="116" fill="url(#bg5)"/>

  <!-- まっすぐでシンプルな双葉シルエット (高視認性) -->
  <g filter="url(#softShadow5)" fill="#ffffff">
    <!-- 茎 -->
    <path d="M 252,360 C 252,295 253,240 253,215 L 259,215 C 259,240 260,295 260,360 Z"/>

    <!-- 左の丸い若葉 -->
    <path d="M 253,240 C 215,240 165,205 175,155 C 198,130 250,170 253,215 Z"/>

    <!-- 右の丸い若葉 -->
    <path d="M 259,225 C 295,225 345,190 335,140 C 312,115 262,155 259,200 Z" opacity="0.95"/>

    <!-- 根元の大地ドット -->
    <ellipse cx="256" cy="365" rx="32" ry="5.5" fill="#d8f3dc" opacity="0.7"/>
  </g>
</svg>
